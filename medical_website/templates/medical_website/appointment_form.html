{% extends 'medical_website/base.html' %}
{% block title %}Форма Специализация{% endblock %}

{% block content %}
<div class="row mb-5"></div>
<div class="row mb-5"></div>
<div class="row mb-5"></div>


<div class="container">
    <div class="row">
        <div class="col-5">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.non_field_errors }}
                        {{ form.as_p}}
                        <lable for="start">Выберите дату</lable>
                        <input type="date" id="start" name="date"
                        value="{{today}}" min="{{today}}" max="{{max_day}}">
                        <label for="start">Выберите доступное время</label>
                        <select id="select" name="time" class="form-select form-select-lg mb-3" aria-label=".form_select">
                            {% for time in all_time %}
                            <option value="{{time}}">{{time}}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">
                    {% if appointment %}
                    Сохранить изменения
                    {% else %}
                    Создать
                    {% endif %}

                    </button>
                    <button type="submit" class="btn btn-primary">Отмена</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
