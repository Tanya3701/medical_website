{% extends 'medical_website/base.html' %}
{% block title %}Форма Услуги{% endblock %}

{% block content %}
<div class="row mb-5"></div>
<div class="row mb-5"></div>
<div class="row mb-5"></div>
<div class="row mb-5"></div>
<div class="container">
    <div class="row">
        <div class="col-5">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.non_field_errors }}
                        {{ form.as_p}}
                    </div>
                    <button type="submit" class="btn btn-primary">
                    {% if service %}
                    Сохранить изменения
                    {% else %}
                    Создать
                    {% endif %}
                    </button>
                    <button type="submit" class="btn btn-primary">Отмена</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
