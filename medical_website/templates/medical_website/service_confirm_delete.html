{% extends 'medical_website/base.html' %}
{% block title %}Подтверждение удаления{% endblock %}
{% block content %}
<div class="row mb-5"></div>
<div class="row mb-5"></div>
<div class="row mb-5"></div>

<div class="container">
    <div class="row">
        <div class="col-5">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class="text-center">Действительно удалить объект {{service.name}} ?</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <button type="submit" class="btn btn-danger">
                    Удалить
                    </button>
                    <a class="btn btn-primary" href="{% url 'medical_website:main' %}" role="button">Отменить</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
